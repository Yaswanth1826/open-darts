name: Build Open Darts APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1-sdk34-35

      # The UI tests download these big jars from Maven Central; one dropped connection fails the whole run, so fetch them with retries.
      # They belong to Robolectric 4.14.1: update them together with that version.
      - name: Pre-fetch Robolectric Android jars
        run: |
          for v in 14-robolectric-10818077-i7 15-robolectric-12650502-i7; do
            dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$v"
            jar="$dir/android-all-instrumented-$v.jar"
            if [ ! -s "$jar" ]; then
              mkdir -p "$dir"
              curl -fL --retry 8 --retry-all-errors --retry-delay 5 -o "$jar.part" "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$v/android-all-instrumented-$v.jar"
              mv "$jar.part" "$jar"
            fi
          done
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without Firebase (sign-in disabled)."
          fi
      - name: Run unit tests and build debug APK
        run: gradle :core:test testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-darts-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - run: npm test